[profile.default]
src = "contracts/src"
test = "contracts/test"
out = "contracts/out"
libs = ["contracts/lib", "node_modules"]
remappings = ["@somnia-chain/reactivity-contracts/=node_modules/@somnia-chain/reactivity-contracts/"]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
somnia_testnet = "https://dream-rpc.somnia.network"
